schema: mindpipe/config/v1

model:
  name: Qwen3.6-35B-A3B
  model_path: /mnt/82_store/LLM-weights/Qwen3.6-35B-A3B

defaults:
  attn_implementation: sdpa
  eval_vlm: false
  zero_shot_batch_size: 4

recipes:
  w4a16:
    weight_bits: 4
    activation_bits: 16
    omniquant_epochs: 20
    omniquant_alpha: 0.5
    omniquant_let: false
    omniquant_lwc: true
    omniquant_let_lr: 5.0e-3
    omniquant_lwc_lr: 1.0e-2
    omniquant_aug_loss: false
    omniquant_deactive_amp: true
    omniquant_use_shift: false

  w8a8:
    weight_bits: 8
    activation_bits: 8
    omniquant_epochs: 10
    omniquant_alpha: 0.5
    omniquant_let: false
    omniquant_lwc: true
    omniquant_let_lr: 1.0e-3
    omniquant_lwc_lr: 5.0e-3
    omniquant_aug_loss: false
    omniquant_deactive_amp: true
    omniquant_use_shift: false

  smoke10:
    weight_bits: 4
    activation_bits: 16
    omniquant_epochs: 0
    omniquant_alpha: 0.5
    omniquant_let: false
    omniquant_lwc: false
    omniquant_aug_loss: false
    omniquant_deactive_amp: true
    omniquant_use_shift: false
    calibration_samples: 10
    max_eval_chunks: 4
    eval_zero_shot: false
